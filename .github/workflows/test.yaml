name: OpenHands runtime tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install runtime test dependencies
        run: |
          uv lock --check
          uv venv --python 3.13
          uv pip install --python .venv/bin/python \
            pytest \
            psutil \
            python-dotenv \
            simple-parsing \
            "weave>=0.53.1,<0.54" \
            "weave-openhands @ git+https://github.com/morganmcg1/weave-openhands.git@a16fe325b2c78692b6e0d904b8883bc2e7429ee8" \
            "openhands-sdk @ git+https://github.com/morganmcg1/software-agent-sdk.git@856dd7ac3fcce6ac6dce114bd5fdbc1370a9ae4e#subdirectory=openhands-sdk" \
            "openhands-tools @ git+https://github.com/morganmcg1/software-agent-sdk.git@856dd7ac3fcce6ac6dce114bd5fdbc1370a9ae4e#subdirectory=openhands-tools"

      - name: Test the complete control plane (no cluster)
        run: .venv/bin/python -m pytest
