name: "cla"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# explicitly configure permissions, in case your GITHUB_TOKEN workflow permissions are set to read-only in repository settings
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "check-signature"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "cla/signatures/version1/cla.json"
          path-to-document: "https://github.com/wandb/senpai/blob/main/cla.md"
          # branch should not be protected
          branch: "cla"
          allowlist: actions-user, dependabot[bot], wandbmachine, jlzhao27, zamborg, tcapelle, morganmcg1, mmcguire, agata-mlynarczyk, tssweeney, shawnlewis, slweis, amlynarczyk, jhodges, jhodges-pai-code, ssathyanandha, zaysola, SaravananCW, *-senpai, senpai-*
