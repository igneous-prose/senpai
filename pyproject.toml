# SPDX-PackageName: senpai

[project]
name = "senpai"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "PyYAML",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torch_geometric",
    "einops",
    "timm",
    "rich",
    "python-dotenv",
    "simple-parsing",
    "wandb",
    "weave>=0.53.1,<0.54",
    "weave-openhands @ git+https://github.com/morganmcg1/weave-openhands.git@a16fe325b2c78692b6e0d904b8883bc2e7429ee8",
    "tqdm",
    "matplotlib",
    "openhands-sdk @ git+https://github.com/morganmcg1/software-agent-sdk.git@856dd7ac3fcce6ac6dce114bd5fdbc1370a9ae4e#subdirectory=openhands-sdk",
    "openhands-tools @ git+https://github.com/morganmcg1/software-agent-sdk.git@856dd7ac3fcce6ac6dce114bd5fdbc1370a9ae4e#subdirectory=openhands-tools",
    "psutil",
    # v2.16.2 is tagged upstream but has not been published to PyPI.
    "exa-py @ https://github.com/exa-labs/exa-py/archive/71f315b4be07d474df128c8fafc70cc7d0e47b56.tar.gz",
]

[tool.setuptools.packages.find]
exclude = ["k8s*", "target*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
    "pytest",
]
