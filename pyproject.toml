# SPDX-PackageName: senpai

[project]
name = "senpai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyYAML",
    "torch",
    "torch_geometric",
    "einops",
    "timm",
    "rich",
    "python-dotenv",
    "simple-parsing",
    "wandb",
    "weave",
    "tqdm",
    "matplotlib",
    # v2.16.2 is tagged upstream but has not been published to PyPI.
    "exa-py @ https://github.com/exa-labs/exa-py/archive/71f315b4be07d474df128c8fafc70cc7d0e47b56.tar.gz",
]

[tool.setuptools.packages.find]
exclude = ["k8s*", "target*", "tests*"]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
]
